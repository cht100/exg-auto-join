[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exg-auto-join"
version = "2.0.0"
description = "EXG 僵尸逃跑服务器自动加入 / 空位监控工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
]

[project.scripts]
exg-auto-join = "exg_auto_join.cli:main"

[tool.setuptools]
packages = ["exg_auto_join"]
